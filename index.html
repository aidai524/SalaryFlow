<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="description"
      content="DECash: USDC and USDT payroll for global teams."
    />
    <meta name="theme-color" content="#f6f6f6" />
    <script>
      (() => {
        const storageKey = "salaryflow:theme:v1";
        let theme = "light";
        try {
          const storedTheme = localStorage.getItem(storageKey);
          if (storedTheme === "dark" || storedTheme === "light") theme = storedTheme;
        } catch {
          // Use the light default when storage is unavailable.
        }

        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#171c26" : "#f6f6f6",
        );
      })();
    </script>
    <title>DECash</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
